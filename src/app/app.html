<header class="main-header">
  <div class="header-container">
    <div class="brand">
      <span class="brand-icon">
        <svg class="ico" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      </span>
      <h1>Proyecto de Benjamin Zurbriggen</h1>
    </div>

    <nav class="nav-menu">
      @for (op of menu(); track op.ruta) {
        <button [routerLink]="op.ruta" class="nav-btn" routerLinkActive="active-link">{{ op.texto }}</button>
      }
    </nav>

    <div class="header-right">
      <app-reloj></app-reloj>

      @if (auth.usuario(); as u) {
        <div class="user-chip" [class.admin]="u.categoria >= 2">
          <svg class="ico" viewBox="0 0 24 24">
            @if (u.categoria >= 2) {
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            } @else {
              <circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/>
            }
          </svg>
          <span class="user-text">
            <strong>{{ u.nombre }}</strong>
            <small>{{ auth.nombreCategoria() }}</small>
          </span>
        </div>
        <button class="btn-salir" (click)="salir()" title="Cerrar sesión">
          <svg class="ico" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      } @else {
        <button class="btn-ingresar" routerLink="/login">
          <svg class="ico" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Ingresar
        </button>
      }
    </div>
  </div>
</header>

<main class="content-wrapper">
  <router-outlet></router-outlet>
</main>

<app-footer></app-footer>
